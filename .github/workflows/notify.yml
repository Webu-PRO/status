# Sends ntfy.sh push notifications and Resend e-mails when incidents open or close.
#
# Trigger: workflow_run on "Uptime CI" (fires after every 5-min check) +
#          schedule fallback every 15 min in case workflow_run is delayed.
#
# Deduplication: we add a label to each notified issue so the same event
# is never sent twice. Labels: ntfy-sent-open, ntfy-sent-closed.
#
# Injection-safety: issue titles/URLs come from `gh issue list --json`
# piped through jq and assigned to LOCAL shell variables ($title, $url,
# $number). They are passed directly as shell-variable arguments to curl
# — NOT via ${{ github.event.* }} expression interpolation, which would
# be a script-injection vector on a public repo.
#
# NTFY_TOPIC is a repository secret, only ever referenced as $NTFY_TOPIC
# in the shell env — never printed to logs or embedded in this file.
name: Notify on Incident

on:
  workflow_run:
    workflows: ["Uptime CI"]
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: read  # checkout, for scripts/incident-email.mjs
  issues: write   # needed to add dedup labels via gh issue edit

jobs:
  notify:
    name: Send ntfy notifications
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      ALERT_EMAIL_TO: nagy.viktordp@gmail.com
      REPO: Webu-PRO/status

    steps:
      # Ensure our dedup labels exist before assigning them
      - name: Create dedup labels if missing
        run: |
          gh label create "ntfy-sent-open"   --repo "$REPO" \
            --color "ededed" --description "ntfy open notification sent"   \
            2>/dev/null || true
          gh label create "email-sent-open"   --repo "$REPO" \
            --color "f9d0c4" --description "Resend open e-mail sent"   \
            2>/dev/null || true
          gh label create "email-sent-closed" --repo "$REPO" \
            --color "c2e0c6" --description "Resend closed e-mail sent" \
            2>/dev/null || true
          gh label create "ntfy-sent-closed" --repo "$REPO" \
            --color "bfd4f2" --description "ntfy closed notification sent" \
            2>/dev/null || true

      # ── Notify new (opened) incidents ──────────────────────────────────
      - name: Notify new incidents
        run: |
          # Get open issues labelled 'status' that haven't been notified yet.
          # Label check uses contains(…) on the parsed array — no toJSON matching.
          gh issue list \
            --repo "$REPO" \
            --label "status" \
            --state open \
            --limit 50 \
            --json number,title,labels,url \
            --jq '.[] | select(
              (.labels | map(.name) | contains(["ntfy-sent-open"]) | not)
            ) | "\(.number)\t\(.title)\t\(.url)"' \
          > /tmp/new_open.tsv

          while IFS=$'\t' read -r number title url; do
            [ -z "$number" ] && continue
            # $title and $url are local shell vars from jq — injection-safe.
            # $NTFY_TOPIC is an env secret — never interpolated through a workflow expression.
            curl -sf \
              -H "Title: Webu kiesés" \
              -H "Priority: high" \
              -H "Tags: warning,status_page" \
              -H "Click: $url" \
              -d "Kiesés: $title" \
              "https://ntfy.sh/${NTFY_TOPIC}" || true

            gh issue edit "$number" --repo "$REPO" --add-label "ntfy-sent-open"
          done < /tmp/new_open.tsv

      # ── Notify resolved (closed) incidents ─────────────────────────────
      - name: Notify resolved incidents
        run: |
          gh issue list \
            --repo "$REPO" \
            --label "status" \
            --state closed \
            --limit 10 \
            --json number,title,labels,url \
            --jq '.[] | select(
              (.labels | map(.name) | contains(["ntfy-sent-closed"]) | not)
            ) | "\(.number)\t\(.title)\t\(.url)"' \
          > /tmp/new_closed.tsv

          while IFS=$'\t' read -r number title url; do
            [ -z "$number" ] && continue
            curl -sf \
              -H "Title: Webu kiesés megoldva" \
              -H "Priority: default" \
              -H "Tags: white_check_mark,status_page" \
              -H "Click: $url" \
              -d "Megoldva: $title" \
              "https://ntfy.sh/${NTFY_TOPIC}" || true

            gh issue edit "$number" --repo "$REPO" --add-label "ntfy-sent-closed"
          done < /tmp/new_closed.tsv

      # ── E-mail (Resend) ────────────────────────────────────────────────
      # Open: every open 'status' issue without email-sent-open.
      # Closed: only issues we already e-mailed as open (email-sent-open),
      # so the first run does not mail out old, historical incidents.
      # Subject, HTML and text come from scripts/incident-email.mjs, which reads
      # the issue as JSON on stdin — titles never touch shell syntax.
      - uses: actions/checkout@v6
        if: env.RESEND_API_KEY != ''

      - name: E-mail incidents via Resend
        if: env.RESEND_API_KEY != ''
        run: |
          FROM="${RESEND_FROM:-Webu Státusz <status@webu.hu>}"

          send_mail() { # $1 issue number
            gh issue view "$1" --repo "$REPO" \
                --json number,title,url,body,createdAt,closedAt \
            | node scripts/incident-email.mjs \
            | jq --arg from "$FROM" --arg to "$ALERT_EMAIL_TO" '. + {from:$from, to:[$to]}' \
            | curl -sf -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @- > /dev/null
          }

          gh issue list --repo "$REPO" --label "status" --state open --limit 50 \
            --json number,labels \
            --jq '.[] | select((.labels|map(.name)|contains(["email-sent-open"]))|not) | .number' > /tmp/mail_open.txt

          while read -r number; do
            [ -z "$number" ] && continue
            if send_mail "$number"; then
              gh issue edit "$number" --repo "$REPO" --add-label "email-sent-open" \
                || echo "::warning::label email-sent-open failed for #$number"
            else
              echo "::warning::Resend send failed for #$number"
            fi
          done < /tmp/mail_open.txt

          gh issue list --repo "$REPO" --label "status" --label "email-sent-open" \
            --state closed --limit 20 \
            --json number,labels \
            --jq '.[] | select((.labels|map(.name)|contains(["email-sent-closed"]))|not) | .number' > /tmp/mail_closed.txt

          while read -r number; do
            [ -z "$number" ] && continue
            if send_mail "$number"; then
              gh issue edit "$number" --repo "$REPO" --add-label "email-sent-closed" \
                || echo "::warning::label email-sent-closed failed for #$number"
            else
              echo "::warning::Resend send failed for #$number"
            fi
          done < /tmp/mail_closed.txt
